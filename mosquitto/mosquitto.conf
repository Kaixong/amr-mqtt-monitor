# --- security: every client must log in; topic rights come from the ACL ---
per_listener_settings false
allow_anonymous false
password_file /mosquitto/secrets/passwd
acl_file /mosquitto/secrets/acl

# --- persistence: retained messages and persistent sessions survive a broker restart ---
persistence true
persistence_location /mosquitto/data/
autosave_interval 30

# --- limits ---
max_keepalive 60
max_packet_size 262144
max_queued_messages 1000

# --- broker statistics on $SYS/# (shown on the dashboard) ---
sys_interval 5

# --- logging (docker compose logs mosquitto) ---
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# --- listeners (docker publishes them on 127.0.0.1 only) ---
# MQTT over TLS: Python services and command line tools (certs: scripts/setup-tls.sh).
# There is no plain-text TCP listener.
listener 8883
protocol mqtt
max_connections 50
cafile /mosquitto/secrets/ca.crt
certfile /mosquitto/secrets/server.crt
keyfile /mosquitto/secrets/server.key
tls_version tlsv1.2

# MQTT over plain WebSocket: browser dashboard on this machine (localhost only, see README)
listener 9001
protocol websockets
max_connections 50

# MQTT over secure WebSocket (wss://): for browsers that trust certs/ca.crt
listener 9443
protocol websockets
max_connections 50
cafile /mosquitto/secrets/ca.crt
certfile /mosquitto/secrets/server.crt
keyfile /mosquitto/secrets/server.key
tls_version tlsv1.2
