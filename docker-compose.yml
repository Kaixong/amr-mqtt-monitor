services:
  mosquitto:
    image: eclipse-mosquitto:2
    # published on 127.0.0.1 only: reachable from this PC (WSL forwards it to Windows),
    # not from the network
    ports:
      - "127.0.0.1:8883:8883"   # MQTT over TLS
      - "127.0.0.1:9001:9001"   # MQTT over WebSocket (dashboard)
      - "127.0.0.1:9443:9443"   # MQTT over secure WebSocket
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/secrets:/mosquitto/secrets:ro
      - ./mosquitto/data:/mosquitto/data
    restart: unless-stopped
  dashboard:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
    restart: unless-stopped
